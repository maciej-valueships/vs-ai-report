<!--
  Valueships Key Visual — inline SVG snippet for HTML.

  Drop this SVG into any HTML document. The wrapping div positions it in
  the corner you specify. To use a different corner, change the inline
  style (top/left vs bottom/right) and mirror the SVG via transform.

  For full-page hero coverage, duplicate this snippet twice with opposite
  corners (e.g. top-left + bottom-right).

  Color: brand pink #FF005E. For pink/dark backgrounds, change to #FFFFFF.
-->

<!-- TOP-LEFT version -->
<div class="vs-key-visual vs-key-visual--topleft"
     style="position: absolute; top: 0; left: 0; width: 320px; height: 320px;
            pointer-events: none; z-index: 0; overflow: hidden;">
  <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg"
       style="width: 100%; height: 100%; display: block;">
    <g fill="none" stroke="#FF005E" stroke-width="1" stroke-linecap="round">
      <path d="M -20 60 Q 40 100, 100 50 T 220 -20" opacity="0.85"/>
      <path d="M -20 75 Q 45 115, 110 60 T 240 -20" opacity="0.80"/>
      <path d="M -20 90 Q 50 130, 120 70 T 260 -20" opacity="0.74"/>
      <path d="M -20 105 Q 55 145, 130 80 T 280 -20" opacity="0.69"/>
      <path d="M -20 120 Q 60 160, 140 90 T 300 -20" opacity="0.63"/>
      <path d="M -20 135 Q 65 175, 150 100 T 320 -20" opacity="0.58"/>
      <path d="M -20 150 Q 70 190, 160 110 T 340 -20" opacity="0.52"/>
      <path d="M -20 165 Q 75 205, 170 120 T 360 -20" opacity="0.47"/>
      <path d="M -20 180 Q 80 220, 180 130 T 380 -20" opacity="0.42"/>
      <path d="M -20 195 Q 85 235, 190 140 T 400 -20" opacity="0.36"/>
      <path d="M -20 210 Q 90 250, 200 150 T 420 -20" opacity="0.31"/>
    </g>
  </svg>
</div>


<!-- BOTTOM-RIGHT version (mirrored) -->
